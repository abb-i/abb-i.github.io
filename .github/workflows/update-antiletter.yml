# Keeps the three pieces on antiletter.html pointing at your three newest
# Substack posts.
#
# This runs on a GitHub runner, not in anyone's browser. It reads your own
# public RSS feed once a day, rewrites a block of static HTML, and commits the
# result. Visitors still load a plain static page that talks to nobody.
#
# Needs nothing installed: the script is Python standard library only.

name: Refresh Anti Letter

on:
  schedule:
    # 05:17 UTC daily — an odd minute, because everything scheduled on the
    # hour queues behind the rest of GitHub.
    - cron: "17 5 * * *"
  workflow_dispatch: # ...and a "Run workflow" button, for right after you publish

permissions:
  contents: write

concurrency:
  group: refresh-anti-letter
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the feed and rewrite the three entries
        run: python3 scripts/update-antiletter.py

      - name: Commit, but only if something actually changed
        run: |
          if git diff --quiet -- antiletter.html; then
            echo "No new posts — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add antiletter.html
          git commit -m "Anti Letter: refresh the three selected pieces"
          git push
